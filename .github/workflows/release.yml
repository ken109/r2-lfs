name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    # Copies made by the Deploy to Cloudflare button carry this workflow too; only r2-lfs itself releases.
    if: github.repository == 'ken109/r2-lfs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      # Opens or updates a release PR with the changelog and version bumps; merging it tags a release.
      # Pull requests opened with GITHUB_TOKEN do not trigger CI. Add a RELEASE_PLEASE_TOKEN secret
      # (a fine-grained token with contents and pull requests write) to run CI on release PRs.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # move the major version tag
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:pkg

      # Trusted publishing: register this repository and workflow file on npmjs.com; no token is stored here.
      - run: npm publish --provenance --access public

      # `uses: ken109/r2-lfs@v0` follows every 0.x release; README asks gc users to pin an exact tag.
      - name: Move the major version tag
        env:
          MAJOR_TAG: v${{ needs.release-please.outputs.major }}
        run: |
          git tag -f "${MAJOR_TAG}"
          git push -f origin "refs/tags/${MAJOR_TAG}"
